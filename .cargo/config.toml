# Native Linux cross-compilation and linker selection.
#
# Linker choice (clang/mold vs the system default) is handled at build time
# by `gtm/build.rs`, which probes for `mold`, `clang`, and `gcc` and emits the
# matching `-fuse-ld=` flag only when the tool is actually available.  Doing
# it here via hardcoded rustflags would force `-fuse-ld=mold` onto every crate
# (including dependencies), breaking CI runners that don't install mold.
#
# For non-cargo-ndk cross builds, export manually:
#   export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_ANDROID_LINKER=aarch64-linux-android27-clang
# (cargo-ndk injects the correct NDK linker via CARGO_TARGET_*_LINKER itself.)
