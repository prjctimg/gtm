name: Bug report
description: Report a problem with gtm.rs
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gtm --version`
      placeholder: 0.1.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Android / Termux
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Emulator and version (e.g. kitty 0.35, alacritty 0.13)
      placeholder: kitty 0.35
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, and what happened?
      placeholder: |
        1. Start gtm
        2. Press ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `gtmd.log` (run `gtmd` manually, or find the log under your XDG data dir)
      render: shell
