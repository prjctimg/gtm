name: Clippy Auto-Fix


on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: clippy-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Apply clippy auto-fixes
        run: cargo clippy --fix --workspace --allow-dirty --all-targets
      - name: Normalize formatting of auto-fixes
        run: cargo fmt
      - name: Format
        run: cargo fmt --check
      - name: Verify with cargo check
        id: verify
        run: cargo check --workspace
      - name: Commit and auto-merge fixes
        if: success()
        shell: bash
        env:
          GH_BOT_TOKEN: ${{ secrets.APPROVE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # The skip directive is load-bearing, not cosmetic. This push is
          # meant to use APPROVE_PAT so the follow-up workflows trigger, but
          # when that secret is absent the empty userinfo in the remote URL
          # falls back to the persisted GITHUB_TOKEN credential — and a
          # GITHUB_TOKEN push does not trigger workflows. The `pull_request`
          # event for the moved head is still recorded and lands as
          # `action_required` with zero jobs: a red X for a commit that only
          # reformats Rust. Once APPROVE_PAT is configured this tag is
          # harmless, since a PAT push runs CI normally and the directive is
          # simply ignored by the very run it would have suppressed.
          git commit -m "style: auto-fix clippy lints [skip ci]"
          git push "https://x-access-token:${GH_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
      - name: Open PR if verification failed
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: apply clippy auto-fixes"
          title: "style: apply clippy auto-fixes"
          body: |
            `cargo clippy --fix` produced changes that did not pass `cargo check`
            and were not auto-merged. Please review.
          branch: clippy/auto-fix
          delete-branch: true
          labels: |
            clippy
            automated
