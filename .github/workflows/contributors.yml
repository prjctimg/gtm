name: Update CONTRIBUTORS
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate contributors in README
        run: bash scripts/build/contributors.sh
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "prjctimg"
            git config user.email "prjctimg@outlook.com"
            git add README.md
            # Remove deprecated file if it was auto-generated before
            if [ -f CONTRIBUTORS.md ]; then
              git rm -f CONTRIBUTORS.md || rm -f CONTRIBUTORS.md
              git add -A || true
            fi
            git commit -m "docs: update contributors"
            git push
          fi
