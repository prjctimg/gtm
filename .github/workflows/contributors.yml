name: Update CONTRIBUTORS
on:
  # A tag push, not `release: published`. The Release workflow creates the
  # release with the API's `GITHUB_TOKEN`, and GitHub does not start new
  # workflow runs for events that token triggers -- so the `published` event
  # never fired and the list went stale with the release notes. A tag is pushed
  # by a real actor and always delivers.
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Regenerate contributors in README
        run: bash scripts/build/contributors.sh
      - name: Commit if changed
        env:
          GH_BOT_TOKEN: ${{ secrets.APPROVE_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "README already lists every contributor"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${GH_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          attempt=0
          while true; do
            git add README.md
            if [ -f CONTRIBUTORS.md ]; then
              git rm -f CONTRIBUTORS.md
            fi
            if git diff --cached --quiet; then
              echo "nothing staged"
              exit 0
            fi
            # `[skip ci]` is not optional here. This is pushed with a PAT, so
            # the guard GitHub applies to its own GITHUB_TOKEN commits does not
            # cover it: a plain `docs:` commit would start a full CI run and,
            # through the dev push, a nightly release build. `[skip nightly]`
            # is read by the release workflow for the same reason.
            git commit -m "docs: update contributors [skip nightly] [skip ci]"
            if git push "${push_url}" HEAD:dev 2>/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge 3 ]; then
              echo "::error::could not push the contributor list after 3 attempts" >&2
              exit 1
            fi
            sleep 5
            git pull --rebase origin dev 2>/dev/null || true
          done
