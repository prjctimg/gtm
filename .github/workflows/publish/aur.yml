name: aur

on:
  release:
    types: [published]

jobs:
  update:
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          mkdir -p ~/.ssh
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIS2krVfbFMn5v2bYadzY6r65YV0kr0QbYn2L5e8n2Q5" >> ~/.ssh/known_hosts
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" \
            git clone "ssh://aur@aur.archlinux.org/gtm.git" aur-repo

          cd aur-repo
          sed -i "s/pkgver=.*/pkgver=${version}/" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i '/^pkgver()/,/^}/d' PKGBUILD
          makepkg --printsrcinfo > .SRCINFO

          git config user.name "prjctimg"
          git config user.email "prjctimg@outlook.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${version}" || echo "No changes to commit"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push
