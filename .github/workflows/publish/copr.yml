name: copr

on:
  release:
    types: [published]

jobs:
  srpm:
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build SRPM
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          sudo apt-get update
          sudo apt-get install -y rpm

          tar czf "/tmp/gtmd-${version}.tar.gz" \
            --transform "s|^|gtmd-${version}/|" \
            --exclude='target' --exclude='.git' \
            .

          cp dist/gtmd.spec /tmp/gtmd.spec
          sed -i "s/^Version:.*/Version: ${version}/" /tmp/gtmd.spec
          sed -i "s/^Source:.*/Source: gtmd-${version}.tar.gz/" /tmp/gtmd.spec

          mkdir -p /tmp/srpm
          cp /tmp/gtmd.spec /tmp/srpm/
          cp "/tmp/gtmd-${version}.tar.gz" /tmp/srpm/

          rpmbuild -bs /tmp/gtmd.spec \
            --define "_sourcedir /tmp/srpm" \
            --define "_srcrpmdir /tmp/srpm" \
            --define "gtm_version ${version}"

          ls -la /tmp/srpm/*.src.rpm

      - name: Submit to COPR
        env:
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          pip install --break-system-packages copr-cli
          srpm=$(ls /tmp/srpm/*.src.rpm)
          echo "Submitting ${srpm}..."
          copr-cli build prjctimg/gtm "$srpm" --token "$COPR_TOKEN"
