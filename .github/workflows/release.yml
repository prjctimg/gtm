name: Release

on:
  push:
    branches: ["dev"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (e.g. 0.1.2) for stable releases"
        required: false
        type: string
      bench_seconds:
        description: "Benchmark sampling window in seconds (CI default 15)"
        required: false
        default: "30"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
  NODE_OPTIONS: --use-system-ca

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      version: ${{ steps.set-tag.outputs.version }}
      nightly: ${{ steps.set-tag.outputs.nightly }}
      skip: ${{ steps.set-tag.outputs.skip }}
      prev_nightly: ${{ steps.prev-nightly.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive tag
        id: set-tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          manifest_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event.inputs.release_type }}" == "nightly" ]]; then
              tag="nightly"
              version="${manifest_version}+${short_sha}+nightly"
              nightly="true"
            else
              version="${{ github.event.inputs.version }}"
              if [[ -z "$version" ]]; then
                echo "::error::version input is required for stable releases" >&2
                exit 1
              fi
              tag="v${version}"
              nightly="false"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            if echo "${{ github.event.head_commit.message }}" | grep -q "\[skip nightly\]"; then
              echo "::notice::Skipping nightly — [skip nightly] in commit message"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "tag=nightly" >> "$GITHUB_OUTPUT"
              echo "version=0.0.0" >> "$GITHUB_OUTPUT"
              echo "nightly=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            tag="nightly"
            version="${manifest_version}+${short_sha}+nightly"
            nightly="true"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            nightly="false"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "nightly=${nightly}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        if: steps.set-tag.outputs.skip != 'true'
        run: |
          version="${{ steps.set-tag.outputs.version }}"
          if ! [[ "$version" =~ ^[0-9][0-9A-Za-z.+~]*$ ]]; then
            echo "::error::invalid release version '$version' — must start with a digit and contain only [0-9A-Za-z.+~]" >&2
            exit 1
          fi

      - name: Capture previous nightly SHA
        if: steps.set-tag.outputs.skip != 'true'
        id: prev-nightly
        run: |
          prev="$(git rev-parse refs/tags/nightly 2>/dev/null || echo '')"
          echo "sha=${prev}" >> "$GITHUB_OUTPUT"

      - name: Move tag to build commit
        if: steps.set-tag.outputs.skip != 'true'
        run: |
          git config user.name "prjctimg"
          git config user.email "prjctimg@outlook.com"
          tag="${{ steps.set-tag.outputs.tag }}"
          git tag -f "${tag}"
          git push origin "${tag}" --force

  build:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      VERGEN_GIT_SHA: ${{ github.sha }}
      RUSTFLAGS: >-
        ${{ contains(matrix.platform, 'musl') && '-C target-feature=-crt-static' || '' }}
        ${{ matrix.link_override }}
        ${{ matrix.mold_arg }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86_64-linux
            container: debian:12
            family: debian
            link_override: -C linker=gcc
            mold_arg: -C link-arg=-fuse-ld=mold
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            container: debian:12
            family: debian
            link_override: -C linker=gcc
            mold_arg: -C link-arg=-fuse-ld=mold
          - os: macos-latest
            platform: aarch64-darwin
            container: null
            family: macos
            link_override:
            mold_arg:
          - os: ubuntu-latest
            platform: aarch64-android
            container: null
            family: android
            link_override:
            mold_arg:
          - os: ubuntu-22.04
            platform: x86_64-linux-arch
            container: archlinux:latest
            family: arch
            link_override: -C linker=gcc
            mold_arg: -C link-arg=-fuse-ld=mold
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-arch
            container: null
            family: arch-arm
            link_override: -C linker=gcc
            mold_arg: -C link-arg=-fuse-ld=mold
          - os: ubuntu-22.04
            platform: x86_64-linux-musl
            container: null
            family: musl
            link_override: -C linker=gcc
            mold_arg: -C link-arg=-fuse-ld=mold
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
            container: null
            family: musl
            link_override: -C linker=gcc
            mold_arg: -C link-arg=-fuse-ld=mold
    steps:
      - name: Bootstrap tooling (Debian 12 container)
        if: matrix.container == 'debian:12'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git pkg-config \
            libasound2-dev pandoc dpkg-dev rpm zstd libarchive-tools \
            build-essential cmake liblzma-dev clang lld mold

      - name: Install Rust (Debian 12 container)
        if: matrix.container == 'debian:12'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Bootstrap tooling (Arch Linux container)
        if: matrix.container == 'archlinux:latest'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel rust pandoc alsa-lib cmake clang lld mold git \
            libarchive zstd

      - uses: actions/checkout@v7
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu') && matrix.container == null && matrix.family == 'debian'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pandoc rpm zstd libarchive-tools clang lld mold

      - name: Install system dependencies (macOS)
        if: matrix.family == 'macos'
        run: brew install pkg-config pandoc

      - name: Install pandoc (Android build)
        if: matrix.family == 'android'
        run: sudo apt-get update && sudo apt-get install -y pandoc


      - name: Build musl binaries + packages (Alpine container)
        if: matrix.family == 'musl'
        run: |
          platform="${{ matrix.platform }}"
          arch="${platform%-linux-musl}"
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e HOME=/root \
            -e VERGEN_GIT_SHA="$VERGEN_GIT_SHA" \
            alpine:3.22 \
            /bin/sh -c "apk add --no-cache bash && /bin/bash /work/scripts/build/musl-in-container.sh \
              ${platform} ${{ needs.tag.outputs.version }} ${arch}"

      - name: Build Arch Linux binaries + packages (container)
        if: matrix.family == 'arch-arm'
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e HOME=/root \
            -e VERGEN_GIT_SHA="$VERGEN_GIT_SHA" \
            lfdevs/archlinuxarm:base-devel \
            /bin/bash -c "
              echo 'DisableSandboxFilesystem' >> /etc/pacman.conf &&
              pacman-key --init &&
              pacman-key --populate archlinuxarm &&
              pacman -Syu --noconfirm &&
              curl -L -o /tmp/pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-arm64.tar.gz &&
              tar -xzf /tmp/pandoc.tar.gz -C /usr/bin --strip-components=2 &&
              chmod +x /usr/bin/pandoc &&
              /bin/bash /work/scripts/build/arch-in-container.sh aarch64-linux-arch ${{ needs.tag.outputs.version }} aarch64
            "

      - name: Install Android NDK + tools
        if: matrix.family == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Install Rust Android target
        if: matrix.family == 'android'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Build termux-elf-cleaner
        if: matrix.family == 'android'
        run: |
          git clone --depth 1 --branch v3.0.1 https://github.com/termux/termux-elf-cleaner.git
          cmake -S termux-elf-cleaner -B termux-elf-cleaner/build -DCMAKE_BUILD_TYPE=Release
          cmake --build termux-elf-cleaner/build -j

      - name: Build release binaries
        if: matrix.family != 'android' && matrix.family != 'musl' && matrix.family != 'arch-arm'
        run: cargo build --release

      - name: Assert glibc compatibility (<= 2.36)
        if: matrix.family == 'debian'
        shell: bash
        run: |
          set -euo pipefail
          for bin in target/release/gtm target/release/gtmd; do
            max="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 || true)"
            echo "$bin requires ${max:-<no glibc symbols>}"
            if [ -z "$max" ] || ! dpkg --compare-versions "${max#GLIBC_}" le 2.36; then
              echo "::error::$bin requires $max; Debian 12 ships glibc 2.36" >&2
              exit 1
            fi
          done

      - name: Build Android release binaries
        if: matrix.family == 'android'
        run: |
          GTM_GEN_COMPLETIONS="$(pwd)/artifacts" CARGO_INCREMENTAL=0 cargo ndk -t arm64-v8a -P 27 \
            build --release --no-default-features --features pulseaudio

      - name: Clean Android ELF sections
        if: matrix.family == 'android'
        run: |
          termux-elf-cleaner/build/termux-elf-cleaner target/aarch64-linux-android/release/gtmd
          termux-elf-cleaner/build/termux-elf-cleaner target/aarch64-linux-android/release/gtm

      - name: Generate manpages (pandoc)
        if: matrix.family != 'musl' && matrix.family != 'arch-arm'
        run: ./scripts/build/manpages.sh artifacts

      - name: Generate shell completions
        if: matrix.family != 'musl' && matrix.family != 'arch-arm' && matrix.family != 'android'
        run: GTM_GEN_COMPLETIONS="$(pwd)/artifacts" cargo build --release --quiet

      - name: Package complete archive (desktop)
        if: matrix.family == 'debian' || matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          if [[ "${{ matrix.family }}" == "debian" ]]; then
            arch="${platform%-linux}"
            root="gtm-debian-12-${arch}"
          else
            root="gtm-${platform}"
          fi
          mkdir -p release-assets \
            "$root/bin" "$root/man/man1" "$root/completions" \
            "$root/systemd" "$root/desktop" "$root/icons"
          cp target/release/gtm  "$root/bin/"
          cp target/release/gtmd "$root/bin/"
          cp artifacts/man/*.1        "$root/man/man1/"
          cp artifacts/completions/*  "$root/completions/"
          cp dist/gtmd.service  "$root/systemd/"
          cp dist/gtm.desktop   "$root/desktop/"
          cp assets/gtm.svg     "$root/icons/"
          cp LICENSE            "$root/"
          cp install.sh         "$root/"
          tar czf "release-assets/${root}.tar.gz" "$root"

      - name: Package complete archive (Arch Linux)
        if: matrix.family == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          arch="${platform%-linux-arch}"
          root="gtm-arch-${arch}"
          mkdir -p release-assets \
            "$root/bin" "$root/man/man1" "$root/completions" \
            "$root/systemd" "$root/desktop" "$root/icons"
          cp target/release/gtm  "$root/bin/"
          cp target/release/gtmd "$root/bin/"
          cp artifacts/man/*.1        "$root/man/man1/"
          cp artifacts/completions/*  "$root/completions/"
          cp dist/gtmd.service  "$root/systemd/"
          cp dist/gtm.desktop   "$root/desktop/"
          cp assets/gtm.svg     "$root/icons/"
          cp LICENSE            "$root/"
          cp install.sh         "$root/"
          tar czf "release-assets/gtm-arch-${arch}.tar.gz" "$root"

      - name: Package complete archive (Android)
        if: matrix.family == 'android'
        shell: bash
        run: |
          set -euo pipefail
          root="gtm-aarch64-android"
          mkdir -p release-assets "$root/bin" "$root/man/man1" "$root/completions"
          cp target/aarch64-linux-android/release/gtm  "$root/bin/"
          cp target/aarch64-linux-android/release/gtmd "$root/bin/"
          cp artifacts/man/*.1       "$root/man/man1/"
          cp artifacts/completions/* "$root/completions/"
          cp install.sh              "$root/"
          tar czf "release-assets/gtm-aarch64-android.tar.gz" "$root"

      - name: Build Debian/Ubuntu .deb
        if: matrix.family == 'debian'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.tag.outputs.version }}"
          cargo install cargo-deb --locked --version 3.7.0
          mkdir -p gtm/deb-assets/man gtm/deb-assets/completions
          cp artifacts/man/* gtm/deb-assets/man/
          cp artifacts/completions/* gtm/deb-assets/completions/
          cp target/release/gtmd gtm/deb-assets/gtmd
          cp dist/gtmd.service gtm/deb-assets/
          cp dist/gtm.desktop gtm/deb-assets/
          cp assets/gtm.svg gtm/deb-assets/
          cargo deb --package gtm
          deb_arch="$(dpkg --print-architecture)"
          case "${{ matrix.platform }}" in
            x86_64-linux) [ "$deb_arch" = "amd64" ] || { echo "::error::expected amd64 for ${{ matrix.platform }}, got $deb_arch" >&2; exit 1; } ;;
            aarch64-linux) [ "$deb_arch" = "arm64" ] || { echo "::error::expected arm64 for ${{ matrix.platform }}, got $deb_arch" >&2; exit 1; } ;;
          esac
          for deb in target/debian/gtm_*.deb; do
            echo "Built deb: $(basename "$deb") (arch $deb_arch) for ${{ matrix.platform }}"
            mv "$deb" "release-assets/gtm_${version}_${deb_arch}.deb"
          done
          rm -rf gtm/deb-assets
          ls -lh release-assets/*.deb

      - name: Stage rootfs tree (RPM)
        if: matrix.family == 'debian'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/usr/bin \
            stage/usr/lib/systemd/user \
            stage/usr/share/man/man1 \
            stage/usr/share/bash-completion/completions \
            stage/usr/share/zsh/site-functions \
            stage/usr/share/fish/vendor_completions.d \
            stage/usr/share/elvish/lib \
            stage/usr/share/powershell/Modules \
            stage/usr/share/applications \
            stage/usr/share/icons/hicolor/scalable/apps \
            stage/usr/share/licenses/gtm
          cp target/release/gtm  stage/usr/bin/
          cp target/release/gtmd stage/usr/bin/
          cp dist/gtmd.service stage/usr/lib/systemd/user/
          cp artifacts/man/*.1 stage/usr/share/man/man1/
          cp artifacts/completions/gtm.bash  stage/usr/share/bash-completion/completions/gtm
          cp artifacts/completions/gtmd.bash stage/usr/share/bash-completion/completions/gtmd
          cp artifacts/completions/_gtm  stage/usr/share/zsh/site-functions/_gtm
          cp artifacts/completions/_gtmd stage/usr/share/zsh/site-functions/_gtmd
          cp artifacts/completions/gtm.fish  stage/usr/share/fish/vendor_completions.d/
          cp artifacts/completions/gtmd.fish stage/usr/share/fish/vendor_completions.d/
          cp artifacts/completions/gtm.elv  stage/usr/share/elvish/lib/
          cp artifacts/completions/gtmd.elv stage/usr/share/elvish/lib/
          cp artifacts/completions/gtm.ps1  stage/usr/share/powershell/Modules/
          cp artifacts/completions/gtmd.ps1 stage/usr/share/powershell/Modules/
          cp dist/gtm.desktop stage/usr/share/applications/
          cp assets/gtm.svg stage/usr/share/icons/hicolor/scalable/apps/
          cp LICENSE stage/usr/share/licenses/gtm/

      - name: Build Fedora/RHEL .rpm
        if: matrix.family == 'debian'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.tag.outputs.version }}"
          rpm_arch="$(rpmbuild --eval '%{_target_cpu}')"
          rpmbuild -bb \
            --define "_topdir $PWD/rpmbuild" \
            --define "gtm_version $version" \
            --define "gtm_staging $PWD/stage" \
            --define "gtm_changelog_date $(date -u +'%a %b %d %Y')" \
            dist/rpm/gtm.spec
          cp rpmbuild/RPMS/*/*.rpm "release-assets/gtm-${version}.${rpm_arch}.rpm"

      - name: Stage rootfs tree (Arch .pkg.tar.zst)
        if: matrix.family == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/usr/bin \
            stage/usr/lib/systemd/user \
            stage/usr/share/man/man1 \
            stage/usr/share/bash-completion/completions \
            stage/usr/share/zsh/site-functions \
            stage/usr/share/fish/vendor_completions.d \
            stage/usr/share/elvish/lib \
            stage/usr/share/powershell/Modules \
            stage/usr/share/applications \
            stage/usr/share/icons/hicolor/scalable/apps \
            stage/usr/share/licenses/gtm
          cp target/release/gtm  stage/usr/bin/
          cp target/release/gtmd stage/usr/bin/
          cp dist/gtmd.service stage/usr/lib/systemd/user/
          cp artifacts/man/*.1 stage/usr/share/man/man1/
          cp artifacts/completions/gtm.bash  stage/usr/share/bash-completion/completions/gtm
          cp artifacts/completions/gtmd.bash stage/usr/share/bash-completion/completions/gtmd
          cp artifacts/completions/_gtm  stage/usr/share/zsh/site-functions/_gtm
          cp artifacts/completions/_gtmd stage/usr/share/zsh/site-functions/_gtmd
          cp artifacts/completions/gtm.fish  stage/usr/share/fish/vendor_completions.d/
          cp artifacts/completions/gtmd.fish stage/usr/share/fish/vendor_completions.d/
          cp artifacts/completions/gtm.elv  stage/usr/share/elvish/lib/
          cp artifacts/completions/gtmd.elv stage/usr/share/elvish/lib/
          cp artifacts/completions/gtm.ps1  stage/usr/share/powershell/Modules/
          cp artifacts/completions/gtmd.ps1 stage/usr/share/powershell/Modules/
          cp dist/gtm.desktop stage/usr/share/applications/
          cp assets/gtm.svg stage/usr/share/icons/hicolor/scalable/apps/
          cp LICENSE stage/usr/share/licenses/gtm/

      - name: Build Arch Linux package
        if: matrix.family == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          version="${{ needs.tag.outputs.version }}"
          arch="${platform%-linux-arch}"
          ./scripts/build/arch-pkg.sh "$version" "$arch" stage \
            "release-assets/gtm-${version}-${arch}.pkg.tar.zst"

      - name: Build Termux .deb packages
        if: matrix.family == 'android'
        run: |
          pip install termux-create-package ruamel.yaml
          version="${{ needs.tag.outputs.version }}"
          files="target/aarch64-linux-android/termux-pkg/files"
          mkdir -p "$files/bin" "$files/share/man/man1"
          cp target/aarch64-linux-android/release/gtmd "$files/bin/"
          cp target/aarch64-linux-android/release/gtm  "$files/bin/"
          cp artifacts/man/gtm.1 artifacts/man/gtmd.1 artifacts/man/gtmd-ipc.1 "$files/share/man/man1/"
          termux-create-package \
            --pkg-version "$version" \
            --pkg-arch aarch64 \
            dist/termux/gtm.yml
          mv "gtm_${version}_aarch64.deb" "release-assets/gtm-android-${version}-aarch64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [tag, build]
    if: needs.tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate release-notes draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          version="${{ needs.tag.outputs.version }}"
          if [[ "${{ needs.tag.outputs.nightly }}" == "true" ]]; then
            prev_tag="${{ needs.tag.outputs.prev_nightly }}"
            if [[ -z "$prev_tag" || "$prev_tag" == "${{ github.sha }}" ]] \
               || ! git merge-base --is-ancestor "$prev_tag" HEAD 2>/dev/null; then
              prev_tag="$(git rev-list --max-parents=0 HEAD)"
            fi
          else
            prev_tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^$tag$" | head -1)"
            [[ -n "$prev_tag" ]] || prev_tag="$(git rev-list --max-parents=0 HEAD)"
          fi
          bash scripts/build/release-notes.sh "${prev_tag}" "${{ github.sha }}" "$version" release-notes.md
          ls -l release-notes.md

      - name: Print release asset manifest
        run: |
          echo "=== Release assets ==="
          ls -lh gtm-*.tar.gz *.deb *.rpm *.pkg.tar.zst *.apk 2>/dev/null
          echo
          echo "Total: $(ls gtm-*.tar.gz *.deb *.rpm *.pkg.tar.zst *.apk 2>/dev/null | wc -l) files"

      - name: Generate checksums
        run: |
          sha256sum gtm-* gtm_*.deb | tee checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.version }}
          draft: false
          prerelease: ${{ needs.tag.outputs.nightly == 'true' }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            gtm-*.tar.gz
            *.deb
            *.rpm
            *.pkg.tar.zst
            *.apk
            checksums.txt
            release-notes.md

      - name: Prune stale nightly assets
        if: needs.tag.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t kept < <(
            ls gtm-*.tar.gz *.deb *.rpm *.pkg.tar.zst *.apk \
              checksums.txt release-notes.md 2>/dev/null | xargs -n1 basename
          )
          gh release view nightly --json assets -q '.assets[].name' 2>/dev/null \
            | while IFS= read -r name; do
                [ -n "$name" ] || continue
                [[ " ${kept[*]} " == *" $name "* ]] && continue
                gh release delete-asset nightly "$name" -y || true
              done

      - name: Force-publish nightly (draft guard)
        if: always() && needs.tag.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
            -X PATCH -f draft=false >/dev/null || \
            echo "::warning::could not un-draft nightly release"

  bench:
    needs: [tag, release]
    if: needs.tag.outputs.skip != 'true' && (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libasound2t64 || sudo apt-get install -y libasound2
          sudo apt-get install -y libasound2-dev libogg-dev libvorbis-dev libflac-dev

      - name: Install cliamp (reference player)
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build cliamp binary
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if go install github.com/bjarneo/cliamp@latest; then
              exit 0
            fi
            echo "cliamp install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::could not install cliamp after 5 attempts" >&2
          exit 1

      - name: Extract gtm binaries from published archive
        shell: bash
        run: |
          set -euo pipefail
          [ -f gtm-debian-12-x86_64.tar.gz ] || { echo "::error::x86_64-linux archive not found (bench uses the Debian 12 glibc build)" >&2; exit 1; }
          tar xzf gtm-debian-12-x86_64.tar.gz
          mkdir -p bench-bins
          cp gtm-debian-12-x86_64/bin/gtm gtm-debian-12-x86_64/bin/gtmd bench-bins/
          chmod +x bench-bins/gtm bench-bins/gtmd
          ls -l bench-bins/

      - name: Collect benchmark results
        shell: bash
        env:
          GTM_BIN: bench-bins/gtm
          GTMD_BIN: bench-bins/gtmd
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          ./scripts/bench/collect.sh "${{ needs.tag.outputs.version }}" "${{ github.event.inputs.bench_seconds || '30' }}"

      - name: Render BENCHMARK.md
        shell: bash
        run: ./scripts/bench/render.sh --tag "${{ needs.tag.outputs.version }}"

      - name: Commit benchmark results back (dev only)
        if: github.ref == 'refs/heads/dev'
        env:
          GH_BOT_TOKEN: ${{ secrets.APPROVE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${GH_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          attempt=0
          while true; do
            if git diff --cached --quiet; then
              git add -f BENCHMARK.md stats.json assets/fixtures
            fi
            if git diff --cached --quiet; then
              echo "no benchmark changes to commit"
              exit 0
            fi
            git commit -m "bench: results for ${{ needs.tag.outputs.version }} [skip nightly]" >/dev/null
            if git push "${push_url}" dev 2>/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge 3 ]; then
              echo "::error::could not push benchmark results after 3 attempts (concurrent run?)" >&2
              exit 1
            fi
            sleep 5
            git pull --rebase origin dev 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: |
            BENCHMARK.md
            stats.json
          if-no-files-found: error

  crates-io:
    needs: [tag, build]
    if: needs.tag.outputs.skip != 'true' && needs.tag.outputs.nightly == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Set crates.io token
        run: echo "CARGO_REGISTRY_TOKEN=${{ steps.auth.outputs.token }}" >> "${GITHUB_ENV}"

      - name: Publish crate
        run: |
          set -euo pipefail
          version="${{ needs.tag.outputs.version }}"

          for attempt in 1 2 3 4 5 6; do
            out="$(cargo publish -p gtm 2>&1)"
            if [[ $? -eq 0 ]]; then
              echo "gtm v${version} published"
              exit 0
            fi
            if grep -q "already exists" <<<"${out}"; then
              echo "gtm v${version}: already published, skipping"
              exit 0
            fi
            echo "gtm v${version}: publish failed, retrying (attempt ${attempt}/6)..."
            echo "${out}"
            sleep 30
          done
          exit 1


