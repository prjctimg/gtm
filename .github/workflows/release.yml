# Release pipeline — builds gtm + gtmd for Linux (x86_64, ARM), macOS, and Android (Termux).
#
# Pipeline:
#
#   tag job         → derive tag/version; force-point tag at the build commit
#     │               (stable: vX.Y.Z, nightly: `nightly` at latest main)
#     ▼
#   build job       → for each OS/arch:
#     │                1. cargo build --release (or cargo-ndk for Android)
#     │                2. Generate manpages (pandoc) + completions (release-gen)
#     │                3. Package archives:
#     │                   gtm-full-{platform}.tar.gz  (gtm + gtmd + man + completions)
#     │                   gtmd-{platform}.tar.gz      (gtmd + daemon manpages + service)
#     │                4. Build .deb packages:
#     │                   gtm-full_{version}_{arch}.deb (gtm + gtmd + service, Linux)
#     │                   gtmd_{version}_{arch}.deb
#     │                   gtm_{version}_{arch}.deb       (Termux, PulseAudio backend)
#     │                5. Upload build artifacts
#     │
#     ▼
#   release job     → create/update GitHub Release with all archives + debs + manpages
#
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (e.g. 0.1.2) for stable releases"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      version: ${{ steps.set-tag.outputs.version }}
      nightly: ${{ steps.set-tag.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.release_type }}" == "nightly" ]]; then
              tag="nightly"
              version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
              nightly="true"
            else
              version="${{ github.event.inputs.version }}"
              if [[ -z "$version" ]]; then
                echo "::error::version input is required for stable releases" >&2
                exit 1
              fi
              tag="v${version}"
              nightly="false"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            nightly="false"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "nightly=${nightly}" >> "$GITHUB_OUTPUT"

      - name: Delete and recreate tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tag="${{ steps.set-tag.outputs.tag }}"
          git tag -d "${tag}" 2>/dev/null || true
          git push origin ":refs/tags/${tag}" 2>/dev/null || true
          git tag "${tag}"
          git push origin "${tag}" --force

  build:
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: macos-latest
            platform: aarch64-darwin
          - os: ubuntu-latest
            platform: aarch64-android
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu') && matrix.platform != 'aarch64-android'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pandoc

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install pkg-config pandoc

      - name: Install pandoc (Android build)
        if: matrix.platform == 'aarch64-android'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Clone gtm.spec (manpage sources)
        run: git clone --depth 1 https://github.com/prjctimg/gtm.spec.git ../gtm.spec

      - name: Install Android NDK + tools
        if: matrix.platform == 'aarch64-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Install Rust Android target
        if: matrix.platform == 'aarch64-android'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Build termux-elf-cleaner
        if: matrix.platform == 'aarch64-android'
        run: |
          git clone --depth 1 --branch v3.0.1 https://github.com/termux/termux-elf-cleaner.git
          cmake -S termux-elf-cleaner -B termux-elf-cleaner/build -DCMAKE_BUILD_TYPE=Release
          cmake --build termux-elf-cleaner/build -j

      - name: Build release binaries
        if: matrix.platform != 'aarch64-android'
        run: cargo build --release

      - name: Build Android release binaries
        if: matrix.platform == 'aarch64-android'
        run: |
          CARGO_INCREMENTAL=0 cargo ndk -t arm64-v8a -P 27 \
            build --release --no-default-features --features pulseaudio

      - name: Clean Android ELF sections
        if: matrix.platform == 'aarch64-android'
        run: |
          termux-elf-cleaner/build/termux-elf-cleaner target/aarch64-linux-android/release/gtmd
          termux-elf-cleaner/build/termux-elf-cleaner target/aarch64-linux-android/release/gtm

      - name: Generate manpages (pandoc)
        run: ./scripts/gen-manpages.sh artifacts

      - name: Generate shell completions
        run: cargo run --release --bin release-gen completions artifacts

      - name: Package binaries (desktop)
        if: matrix.platform != 'aarch64-android'
        shell: bash
        run: |
          cd target/release
          for bin in gtmd gtm; do
            cp "${bin}" "${bin}-${{ matrix.platform }}"
          done

      - name: Package binaries (Android)
        if: matrix.platform == 'aarch64-android'
        shell: bash
        run: |
          cd target/aarch64-linux-android/release
          for bin in gtmd gtm; do
            cp "${bin}" "${bin}-aarch64-android"
          done

      - name: Create component archives
        if: matrix.platform != 'aarch64-android'
        shell: bash
        run: |
          cd target/release
          platform="${{ matrix.platform }}"
          # gtm-full: gtm + gtmd binaries + completions + all manpages
          tar czf "gtm-full-${platform}.tar.gz" \
            "gtm-${platform}" \
            "gtmd-${platform}" \
            ../../artifacts/man/gtm.1 \
            ../../artifacts/man/gtmd.1 \
            ../../artifacts/man/gtmd-ipc.1 \
            ../../artifacts/completions/gtm.bash \
            ../../artifacts/completions/_gtm \
            ../../artifacts/completions/gtm.fish \
            ../../artifacts/completions/gtm.ps1 \
            ../../artifacts/completions/gtm.elv \
            ../../artifacts/completions/gtmd.bash \
            ../../artifacts/completions/_gtmd \
            ../../artifacts/completions/gtmd.fish \
            ../../artifacts/completions/gtmd.ps1 \
            ../../artifacts/completions/gtmd.elv
          # gtmd: daemon binary + daemon manpages + systemd service
          tar czf "gtmd-${platform}.tar.gz" \
            "gtmd-${platform}" \
            ../../artifacts/man/gtmd.1 \
            ../../artifacts/man/gtmd-ipc.1 \
            ../../dist/gtmd.service
          # gtm: TUI+CLI binary only + gtm manpage + gtm completions
          tar czf "gtm-${platform}.tar.gz" \
            "gtm-${platform}" \
            ../../artifacts/man/gtm.1 \
            ../../artifacts/completions/gtm.bash \
            ../../artifacts/completions/_gtm \
            ../../artifacts/completions/gtm.fish \
            ../../artifacts/completions/gtm.ps1 \
            ../../artifacts/completions/gtm.elv

      - name: Create Android archive
        if: matrix.platform == 'aarch64-android'
        run: |
          cd target/aarch64-linux-android/release
          tar czf gtm-full-aarch64-android.tar.gz \
            gtm-aarch64-android \
            gtmd-aarch64-android
          tar czf gtmd-aarch64-android.tar.gz \
            gtmd-aarch64-android

      - name: Install cargo-deb and build Debian packages (Linux only)
        if: startsWith(matrix.os, 'ubuntu') && matrix.platform != 'aarch64-android'
        run: |
          cargo install cargo-deb
          for pkg in gtmd gtm; do
            mkdir -p "$pkg/deb-assets/man" "$pkg/deb-assets/completions"
            cp -r artifacts/man/* "$pkg/deb-assets/man/"
            cp -r artifacts/completions/* "$pkg/deb-assets/completions/"
          done
          cp target/release/gtmd gtm/deb-assets/gtmd
          cp dist/gtmd.service gtm/deb-assets/
          cp dist/gtmd.service gtmd/deb-assets/
          cargo deb --package gtm
          cargo deb --package gtmd
          arch="$(dpkg --print-architecture)"
          version="${{ needs.tag.outputs.version }}"
          for deb in target/debian/gtm-full_*.deb; do
            mv "$deb" "target/debian/gtm-full_${version}-1_${arch}.deb"
          done
          for deb in target/debian/gtmd_*.deb; do
            mv "$deb" "target/debian/gtmd_${version}-1_${arch}.deb"
          done
          for pkg in gtmd gtm; do
            rm -rf "$pkg/deb-assets"
          done

      - name: Build Termux .deb packages
        if: matrix.platform == 'aarch64-android'
        run: |
          pip install termux-create-package ruamel.yaml
          version="${{ needs.tag.outputs.version }}"
          files="target/aarch64-linux-android/termux-pkg/files"
          mkdir -p "$files/bin" "$files/share/man/man1"
          cp target/aarch64-linux-android/release/gtmd "$files/bin/"
          cp target/aarch64-linux-android/release/gtm  "$files/bin/"
          cp artifacts/man/gtm.1 artifacts/man/gtmd.1 artifacts/man/gtmd-ipc.1 "$files/share/man/man1/"
          # termux-create-package 0.12.0 crashes (UnboundLocalError) when
          # --files-dir/--deb-dir are passed, so files_dir/deb_dir are read
          # from the manifest instead (resolved relative to the workspace).
          termux-create-package \
            --pkg-version "$version" \
            --pkg-arch aarch64 \
            termux/gtm.yml

      # Upload per-OS build artifacts so the release job can collect them.
      # Manpages + completions are identical across platforms, so they are
      # uploaded once (x86_64-linux) to keep `merge-multiple` conflict-free.
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            target/release/gtm-full-*
            target/release/gtmd-*
            target/release/gtm-*
            target/aarch64-linux-android/release/gtm-full-*
            target/aarch64-linux-android/release/gtmd-*
            target/debian/*.deb
            ./*.deb

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x86_64-linux'
        with:
          name: artifacts-docs
          path: |
            artifacts/man
            artifacts/completions

  # Collects all platform artifacts and creates a single GitHub Release
  # with platform-specific binaries, archives, debs, manpages, and completions.
  # For `nightly` runs this updates the existing `nightly` prerelease.
  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true

      - name: Collect release files
        run: |
          echo "=== Release artifacts ==="
          find . -type f \( -name "gtm-full-*" -o -name "gtmd-*" -o -name "*.deb" -o -path "*/man/*" -o -path "*/completions/*" \) | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          prerelease: ${{ needs.tag.outputs.nightly == 'true' }}
          generate_release_notes: true
          files: |
            target/release/gtm-full-*-linux
            target/release/gtm-full-*-darwin
            target/release/gtmd-*-linux
            target/release/gtmd-*-darwin
            target/release/*.tar.gz
            target/aarch64-linux-android/release/gtm-full-*
            target/aarch64-linux-android/release/gtmd-*
            artifacts/man/*
            artifacts/completions/*
            target/debian/*.deb
            ./*.deb
