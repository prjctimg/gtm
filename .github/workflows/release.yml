name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Delete and recreate tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tag="${{ steps.set-tag.outputs.tag }}"
          git tag -d "${tag}" 2>/dev/null || true
          git push origin ":refs/tags/${tag}" 2>/dev/null || true
          git tag "${tag}"
          git push origin "${tag}" --force

  build:
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pandoc

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install pkg-config pandoc

      - name: Build release binaries
        run: cargo build --release

      - name: Generate manpages (pandoc)
        run: ./scripts/gen-manpages.sh artifacts

      - name: Generate shell completions
        run: cargo run --release --bin release-gen completions artifacts

      - name: Package binaries
        shell: bash
        run: |
          arch="$(uname -m)"
          os="${{ matrix.os }}"
          case "${os}" in
            ubuntu-latest)   platform="x86_64-linux" ;;
            ubuntu-24.04-arm) platform="${arch}-linux" ;;
            macos-latest)    platform="${arch}-darwin" ;;
          esac
          ext=""
          cd target/release
          for bin in gtmd gtm gtm-tui; do
            cp "${bin}${ext}" "${bin}-${platform}"
          done
          echo "platform=${platform}" >> "$GITHUB_ENV"

      - name: Create component archives
        shell: bash
        run: |
          cd target/release
          # gtm
          tar czf "gtm-${platform}.tar.gz" \
            "gtm-${platform}" \
            ../../artifacts/man/gtm.1
          # gtmd
          tar czf "gtmd-${platform}.tar.gz" \
            "gtmd-${platform}" \
            ../../artifacts/man/gtmd.1 \
            ../../dist/gtmd.service
          # gtm-tui
          tar czf "gtm-tui-${platform}.tar.gz" \
            "gtm-tui-${platform}"

      - name: Install cargo-deb and build Debian packages (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cargo install cargo-deb
          # Copy generated assets into each package's deb-assets/ directory
          # (cargo deb does not support ../ in asset paths)
          for pkg in gtmd gtm-cli gtm-tui; do
            mkdir -p "$pkg/deb-assets/man" "$pkg/deb-assets/completions"
            cp -r artifacts/man/* "$pkg/deb-assets/man/"
            cp -r artifacts/completions/* "$pkg/deb-assets/completions/"
          done
          cp dist/gtmd.service gtmd/deb-assets/
          for pkg in gtmd gtm-cli gtm-tui; do
            cargo deb --package "$pkg"
          done
          # Rename debs to include arch
          arch="$(uname -m)"
          for deb in target/debian/*.deb; do
            base="$(basename "$deb" .deb)"
            mv "$deb" "target/debian/${base}_${arch}.deb"
          done
          # Clean up deb-assets dirs
          for pkg in gtmd gtm-cli gtm-tui; do
            rm -rf "$pkg/deb-assets"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            target/release/gtm-*
            target/release/gtmd-*
            target/release/gtm-tui-*
            artifacts/
            target/debian/*.deb

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true

      - name: Collect release files
        run: |
          echo "=== Release artifacts ==="
          find . -type f \( -name "gtm-*" -o -name "gtmd-*" -o -name "gtm-tui-*" -o -name "*.deb" -o -path "*/man/*" -o -path "*/completions/*" \) | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            target/release/gtm-*-linux
            target/release/gtm-*-darwin
            target/release/gtmd-*-linux
            target/release/gtmd-*-darwin
            target/release/gtm-tui-*-linux
            target/release/gtm-tui-*-darwin
            target/release/gtm-*.tar.gz
            target/release/gtmd-*.tar.gz
            target/release/gtm-tui-*.tar.gz
            artifacts/man/*
            artifacts/completions/*
            target/debian/*.deb
