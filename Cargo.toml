[workspace]
resolver = "3"
members = [
    "gtm",
    "gtmd",
]

[workspace.package]
version = "0.2.83"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/prjctimg/gtm.rs"
homepage = "https://github.com/prjctimg/gtm.rs"
keywords = ["music", "player", "tui", "audio", "youtube"]
categories = ["command-line-utilities", "multimedia::audio"]
readme = "README.md"

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"

# Test binaries link the full dependency graph, and full debuginfo for
# ~950 crates makes GNU ld peak past 6 GiB and get OOM-killed. Debug info is
# worthless in a test anyway (panics carry the message, not a backtrace), so
# drop it and keep the link inside a normal memory budget.
[profile.test]
debug = 0
strip = "debuginfo"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"