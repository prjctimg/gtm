[workspace]
resolver = "2"
members = [
    "gtm-core",
    "gtm-audio",
    "gtmd",
    "gtm",
    "gtm-mpris",
    "release-gen",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/prjctimg/gtm.rs"
homepage = "https://github.com/prjctimg/gtm.rs"
keywords = ["music", "player", "tui", "audio", "youtube"]
categories = ["command-line-utilities", "multimedia::audio"]
readme = "README.md"

[profile.release]
lto = "thin"
strip = "symbols"
