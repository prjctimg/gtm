[package]
name = "gtm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gtm-core = { path = "../gtm-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
clap_complete = { version = "4", optional = true }

[features]
completions = ["clap_complete"]

[[bin]]
name = "gtm"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2025 prjctimg"
license-file = ["../LICENSE"]
extended-description = "GTM CLI client for controlling the GTM music daemon. Provides a command-line interface for playback, queue management, library browsing, and more."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["../artifacts/man/gtm.1", "/usr/share/man/man1/"],
    ["../artifacts/completions/gtm.bash", "/usr/share/bash-completion/completions/gtm"],
    ["../artifacts/completions/_gtm", "/usr/share/zsh/vendor-completions/_gtm"],
    ["../artifacts/completions/gtm.fish", "/usr/share/fish/vendor_completions.d/gtm.fish"],
    ["../artifacts/completions/gtm.ps1", "/usr/share/powershell/completions/gtm.ps1"],
    ["../artifacts/completions/gtm.elv", "/usr/share/elvish/completions/gtm.elv"],
    ["../LICENSE", "/usr/share/doc/gtm/copyright"],
]
