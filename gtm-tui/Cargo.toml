[package]
name = "gtm-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gtm-core = { path = "../gtm-core" }
gtm-audio = { path = "../gtm-audio" }
ratatui = "0.30"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
image = "0.25"
base64 = "0.22"
serde = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[package.metadata.deb]
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2025 prjctimg"
license-file = ["../LICENSE"]
extended-description = "GTM Terminal UI - a feature-rich terminal user interface for the GTM music player."
section = "sound"
priority = "optional"
depends = "$auto"
