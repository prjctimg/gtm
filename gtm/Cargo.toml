[package]
name = "gtm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Feature rich and cross platform terminal audio player"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
gtm-core.workspace = true
gtm-audio.workspace = true
ratatui = "0.30"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
tachyonfx = "0.22"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
image = "0.25"
color-thief = "0.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
base64 = "0.22"
serde = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
libc = "0.2"
webbrowser = "1"
rpassword = "7"

[package.metadata.deb]
name = "gtm"
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2026 prjctimg"
license-file = ["../LICENSE"]
extended-description = "Feature rich and cross platform terminal audio player with background playback and YouTube/Spotify integration."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    "$auto",
    { source = "deb-assets/gtmd", dest = "/usr/bin/gtmd", mode = "755" },
    { source = "deb-assets/gtmd.service", dest = "/usr/lib/systemd/user/gtmd.service" },
    { source = "deb-assets/gtm.desktop", dest = "/usr/share/applications/gtm.desktop" },
    { source = "deb-assets/gtm.svg", dest = "/usr/share/icons/hicolor/scalable/apps/gtm.svg" },
    { source = "deb-assets/man/gtm.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/man/gtmd.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/man/gtmd-ipc.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/completions/gtm.bash", dest = "/usr/share/bash-completion/completions/gtm" },
    { source = "deb-assets/completions/_gtm", dest = "/usr/share/zsh/vendor-completions/_gtm" },
    { source = "deb-assets/completions/gtm.fish", dest = "/usr/share/fish/vendor_completions.d/gtm.fish" },
    { source = "deb-assets/completions/gtm.ps1", dest = "/usr/share/powershell/completions/gtm.ps1" },
    { source = "deb-assets/completions/gtm.elv", dest = "/usr/share/elvish/completions/gtm.elv" },
    { source = "deb-assets/completions/gtmd.bash", dest = "/usr/share/bash-completion/completions/gtmd" },
    { source = "deb-assets/completions/_gtmd", dest = "/usr/share/zsh/vendor-completions/_gtmd" },
    { source = "deb-assets/completions/gtmd.fish", dest = "/usr/share/fish/vendor_completions.d/gtmd.fish" },
    { source = "deb-assets/completions/gtmd.ps1", dest = "/usr/share/powershell/completions/gtmd.ps1" },
    { source = "deb-assets/completions/gtmd.elv", dest = "/usr/share/elvish/completions/gtmd.elv" },
]
