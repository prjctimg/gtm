[package]
name = "gtm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTM music player client - TUI and CLI modes"

[dependencies]
gtm-core = { path = "../gtm-core" }
gtm-audio = { path = "../gtm-audio" }
ratatui = "0.30"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
image = "0.25"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
base64 = "0.22"
serde = "1"
serde_json = "1"
tachyonfx = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"

[package.metadata.deb]
package-name = "gtm-full"
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2025 prjctimg"
license-file = ["../LICENSE"]
extended-description = "GTM music player client - provides both a Terminal UI (TUI) and command-line interface for controlling the GTM music daemon."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["deb-assets/gtmd", "/usr/bin/", "755"],
    ["deb-assets/gtmd.service", "/usr/lib/systemd/user/gtmd.service"],
    ["deb-assets/man/gtm.1", "/usr/share/man/man1/"],
    ["deb-assets/man/gtmd.1", "/usr/share/man/man1/"],
    ["deb-assets/man/gtmd-ipc.1", "/usr/share/man/man1/"],
    ["deb-assets/completions/gtm.bash", "/usr/share/bash-completion/completions/gtm"],
    ["deb-assets/completions/_gtm", "/usr/share/zsh/vendor-completions/_gtm"],
    ["deb-assets/completions/gtm.fish", "/usr/share/fish/vendor_completions.d/gtm.fish"],
    ["deb-assets/completions/gtmd.bash", "/usr/share/bash-completion/completions/gtmd"],
    ["deb-assets/completions/_gtmd", "/usr/share/zsh/vendor-completions/_gtmd"],
    ["deb-assets/completions/gtmd.fish", "/usr/share/fish/vendor_completions.d/gtmd.fish"],
]
