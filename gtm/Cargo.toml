[package]
name = "gtm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Feature rich and cross platform terminal audio player"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["mpris", "youtube"]
# MPRIS D-Bus integration (daemon).
mpris = ["dep:zbus", "dep:zvariant"]
# YouTube search/resolution via innertube-rs (embeds QuickJS via rquickjs).
# rquickjs ships no bindings for aarch64-linux-android, so the Android/Termux
# build disables this to stay compilable (local music playback is unaffected).
youtube = ["dep:innertube-rs"]
# PulseAudio output backend (daemon mixer).
pulseaudio = ["dep:pulseaudio"]
# Test/debug helper that forces IPC failures (tripwire).
debug-fail = ["dep:rustc-hash"]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
tachyonfx = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "io-std", "signal"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
image = "0.25"
color-thief = "0.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
libc = "0.2"
webbrowser = "1"
chrono = { version = "0.4", features = ["serde"] }
rpassword = "7"
rmp-serde = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "3"
dirs = "5"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }
symphonia-adapter-libopus = "0.3"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
timestretch = "0.15"
rustfft = "6"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls-native-roots"] }
urlencoding = "2"
regex = "1"
md5 = "0.8"
rspotify = { version = "0.16.1", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
walkdir = "2"
quick-xml = "0.38"
lofty = "0.24"
lru = "0.12"
hex = "0.4"
fastrand = "2"
getrandom = "0.2"
innertube-rs = { version = "0.6", optional = true }
zbus = { version = "4", features = ["tokio"], optional = true }
zvariant = { version = "4", optional = true }
pulseaudio = { version = "0.3", optional = true }
rustc-hash = { version = "2", optional = true }

[dev-dependencies]
bincode = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[package.metadata.deb]
name = "gtm"
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2026 prjctimg"
license-file = ["../LICENSE"]
extended-description = "Feature rich and cross platform terminal audio player with background playback and YouTube/Spotify integration."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    "$auto",
    { source = "deb-assets/gtmd", dest = "/usr/bin/gtmd", mode = "755" },
    { source = "deb-assets/gtmd.service", dest = "/usr/lib/systemd/user/gtmd.service" },
    { source = "deb-assets/gtm.desktop", dest = "/usr/share/applications/gtm.desktop" },
    { source = "deb-assets/gtm.svg", dest = "/usr/share/icons/hicolor/scalable/apps/gtm.svg" },
    { source = "deb-assets/man/gtm.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/man/gtmd.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/man/gtmd-ipc.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/completions/gtm.bash", dest = "/usr/share/bash-completion/completions/gtm" },
     { source = "deb-assets/completions/_gtm", dest = "/usr/share/zsh/site-functions/_gtm" },
    { source = "deb-assets/completions/gtm.fish", dest = "/usr/share/fish/vendor_completions.d/gtm.fish" },
     { source = "deb-assets/completions/gtm.ps1", dest = "/usr/share/powershell/Modules/gtm.ps1" },
     { source = "deb-assets/completions/gtm.elv", dest = "/usr/share/elvish/lib/gtm.elv" },
    { source = "deb-assets/completions/gtmd.bash", dest = "/usr/share/bash-completion/completions/gtmd" },
     { source = "deb-assets/completions/_gtmd", dest = "/usr/share/zsh/site-functions/_gtmd" },
    { source = "deb-assets/completions/gtmd.fish", dest = "/usr/share/fish/vendor_completions.d/gtmd.fish" },
     { source = "deb-assets/completions/gtmd.ps1", dest = "/usr/share/powershell/Modules/gtmd.ps1" },
     { source = "deb-assets/completions/gtmd.elv", dest = "/usr/share/elvish/lib/gtmd.elv" },
]

[[bin]]
name = "gtm"
path = "src/main.rs"

[[bin]]
name = "gtmd"
path = "src/daemon_main.rs"