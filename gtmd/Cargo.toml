[package]
name = "gtmd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTM background audio daemon"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
gtm-core = { path = "../gtm-core", version = "0.1.7" }
gtm-audio = { path = "../gtm-audio", version = "0.1.7" }
gtm-mpris = { path = "../gtm-mpris", version = "0.1.7", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rspotify = { version = "0.16.1", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }
lofty = "0.24"
lru = "0.12"
hex = "0.4"
base64 = "0.22"
dirs = "5"
fastrand = "2"
chrono = "0.4"

[features]
default = ["mpris"]
mpris = ["gtm-mpris"]
pulseaudio = ["gtm-audio/pulseaudio"]

[package.metadata.deb]
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2025 - present prjctimg"
license-file = ["../LICENSE"]
extended-description = "GTM background audio daemon. Manages playback, library, and IPC for the GTM music player."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    "$auto",
    { source = "deb-assets/gtmd.service", dest = "/usr/lib/systemd/user/gtmd.service" },
    { source = "deb-assets/man/gtmd.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/man/gtmd-ipc.1", dest = "/usr/share/man/man1/" },
    { source = "deb-assets/completions/gtmd.bash", dest = "/usr/share/bash-completion/completions/gtmd" },
    { source = "deb-assets/completions/_gtmd", dest = "/usr/share/zsh/vendor-completions/_gtmd" },
    { source = "deb-assets/completions/gtmd.fish", dest = "/usr/share/fish/vendor_completions.d/gtmd.fish" },
    { source = "deb-assets/completions/gtmd.ps1", dest = "/usr/share/powershell/completions/gtmd.ps1" },
    { source = "deb-assets/completions/gtmd.elv", dest = "/usr/share/elvish/completions/gtmd.elv" },
]

[dev-dependencies]
bincode = "1"
