[package]
name = "gtmd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTM background audio daemon"

[dependencies]
gtm-core = { path = "../gtm-core" }
gtm-audio = { path = "../gtm-audio" }
gtm-mpris = { path = "../gtm-mpris", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }
lru = "0.12"
hex = "0.4"

[features]
default = ["mpris"]
mpris = ["gtm-mpris"]

[package.metadata.deb]
maintainer = "prjctimg <prjctimg@outlook.com>"
copyright = "2025 prjctimg"
license-file = ["../LICENSE"]
extended-description = "GTM background audio daemon. Manages playback, library, and IPC for the GTM music player."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["deb-assets/gtmd.service", "/usr/lib/systemd/user/gtmd.service"],
    ["deb-assets/man/gtmd.1", "/usr/share/man/man1/"],
    ["deb-assets/completions/gtmd.bash", "/usr/share/bash-completion/completions/gtmd"],
    ["deb-assets/completions/_gtmd", "/usr/share/zsh/vendor-completions/_gtmd"],
    ["deb-assets/completions/gtmd.fish", "/usr/share/fish/vendor_completions.d/gtmd.fish"],
    ["deb-assets/completions/gtmd.ps1", "/usr/share/powershell/completions/gtmd.ps1"],
    ["deb-assets/completions/gtmd.elv", "/usr/share/elvish/completions/gtmd.elv"],
]
